# Smithery deployment config -- container runtime (language-agnostic Python path).
# Smithery container-runtime config. Field names follow Smithery's published examples and have not been
# validated against the live schema; run `smithery validate` (or the current CLI equivalent) before use.
runtime: container
startCommand:
  type: http
  configSchema:
    type: object
    title: Trust Gate MCP configuration
    description: >-
      Trust Gate exposes signed-receipt tools and a decision gate. No secrets are required at the
      gateway. Post-quantum-required verification is on by default and is set by the
      TRUST_GATE_REQUIRE_PQ environment variable of the deployment, not by this schema.
    properties: {}
    required: []
  exampleConfig: {}
build:
  dockerfile: Dockerfile
  dockerBuildPath: "."
